<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nuevo Médico</title>
</head>
<body class="container mt-4">
    <h2>Registrar Médico</h2>
    <form th:action="@{/medicos/guardar}" th:object="${medico}" method="post" class="col-md-6">
        <input type="text" th:field="*{nombre}" placeholder="Nombre" class="form-control mb-2" required>
        <input type="text" th:field="*{apellidos}" placeholder="Apellidos" class="form-control mb-2" required>
        <input type="text" th:field="*{especialidad}" placeholder="Especialidad" class="form-control mb-2">
        <input type="text" th:field="*{numColegiado}" placeholder="Nº Colegiado" class="form-control mb-2">
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>
</body>
</html>
