<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Médicos</title>
</head>
<body class="container mt-4">
    <h2>Listado de Médicos</h2>
    <a href="/medicos/nuevo" class="btn btn-outline-primary mb-3">Nuevo Médico</a>
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th><th>Apellidos</th><th>Especialidad</th><th>Nº Colegiado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${medicos}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.apellidos}"></td>
                <td th:text="${m.especialidad}"></td>
                <td th:text="${m.numColegiado}"></td>
            </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">Volver</a>
</body>
</html>
