<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listado de Pacientes</title>
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Pacientes</h2>
        <a href="/" class="btn btn-secondary btn-sm">Volver al Inicio</a>
    </div>

    <a href="/pacientes/nuevo" class="btn btn-success mb-3">Registrar Nuevo Paciente</a>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Fecha de Nacimiento</th>
                <th>Nº Seguridad Social</th>
            </tr>
        </thead>
        <tbody>
            <!-- El iterador 'p' recorre la lista 'pacientes' enviada por el controlador -->
            <tr th:each="p : ${pacientes}">
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.apellidos}"></td>
                <td th:text="${p.fechaNacimiento}"></td>
                <td th:text="${p.numSeguridadSocial}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="4" class="text-center">No hay pacientes registrados aún.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
